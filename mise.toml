[settings]
# Keep the compiler/components in rust-toolchain.toml for editor support.
idiomatic_version_file_enable_tools = ["rust"]
disable_tools = ["ffmpeg", "yt-dlp"]

[tools]
# Node is yt-dlp's JavaScript runtime. Native app development does not use npm.
node = "24.21.0"
python = "3.13.16"
uv = "0.9.28"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
MACOSX_DEPLOYMENT_TARGET = "26.0"

[tasks.setup]
description = "Fetch locked native dependencies and check audio tools"
depends = ["fetch", "setup:media"]
run = "python scripts/native_doctor.py"

[tasks.fetch]
description = "Fetch native dependencies without changing Cargo.lock"
run = "cargo fetch --locked"

[tasks."setup:media"]
description = "Install missing macOS audio tools, or check Linux tools"
run = '''
if [ "$(uname -s)" = Darwin ]; then
  command -v brew >/dev/null || { echo 'Install Homebrew before running setup:media.' >&2; exit 1; }
  for formula in ffmpeg yt-dlp; do
    brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
  done
else
  command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && command -v yt-dlp >/dev/null || {
    echo 'Install ffmpeg (including ffprobe) and yt-dlp with your platform package manager.' >&2
    exit 1
  }
fi
'''

[tasks."setup:tags"]
description = "Prepare the independent Python media tag reader"
run = [
  "uv venv --allow-existing --python '{{ tools.python.path }}/bin/python3' .venv-tags",
  "uv pip sync --python .venv-tags/bin/python crates/audio-engine/tests/requirements.txt",
]

[tasks.doctor]
description = "Check native development prerequisites and audio tools"
run = "python scripts/native_doctor.py"

[tasks.dev]
description = "Launch Jacket's native iced app"
run = "cargo run --locked -p jacket-iced --bin jacket"

[tasks.desktop]
description = "Launch Jacket's native iced app"
run = "cargo run --locked -p jacket-iced --bin jacket"

[tasks.example]
description = "Explore the native interface with fictional tracks"
run = "cargo run --locked -p jacket-iced --bin jacket -- --example"

[tasks.build]
description = "Build the optimized native executable"
run = "cargo build --locked --release -p jacket-iced --bin jacket"

[tasks."check:workspace"]
description = "Compile-check every native workspace crate"
run = "cargo check --locked --workspace --all-targets"

[tasks."check:fmt"]
description = "Check Rust formatting without changing sources"
run = "cargo fmt --all -- --check"

[tasks."check:ci"]
description = "Validate GitHub Actions workflows"
run = "actionlint .github/workflows/*.yml"

[tasks."check:scripts"]
description = "Verify native packaging, dependency boundaries and tool checks"
run = "python scripts/native_tests.py"

[tasks.lint]
description = "Lint all native workspace targets with warnings denied"
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run native application, recovery, review and engine tests"
run = "cargo test --locked --workspace"

[tasks."test:rust"]
description = "Run native Rust workspace tests"
run = "cargo test --locked --workspace"

[tasks."test:media"]
description = "Exercise real FFmpeg, tags and exports without network access"
depends = ["setup:tags"]
env = { AUDIO_DL_TAG_READER_PYTHON = "{{ config_root }}/.venv-tags/bin/python" }
run = "cargo test --locked -p audio-engine --test media_pipeline -- --include-ignored"

[tasks.check]
description = "Run workflow/script checks, formatting, Clippy and native tests"
run = ["mise run check:ci", "mise run check:scripts", "mise run check:licenses", "mise run check:fmt", "mise run lint", "mise run test"]

[tasks.fmt]
description = "Format the native Rust workspace"
run = "cargo fmt --all"

[tasks.format]
description = "Format the native Rust workspace"
run = "cargo fmt --all"

[tasks."tools:stage"]
description = "Stage and verify the complete macOS audio runtime"
run = "python scripts/stage-macos-tools.py --destination target/native-runtime/audio-tools"

[tasks."tools:stage:linux"]
description = "Build the pinned Linux runtime and corresponding source archive"
run = "python scripts/stage-linux-tools.py"

[tasks."package:mac"]
description = "Build an ad-hoc signed macOS native app candidate"
depends = ["build", "tools:stage", "licenses:native"]
run = "python scripts/native_package.py --platform macos --runtime target/native-runtime/audio-tools"

[tasks."package:linux"]
description = "Build a Linux native portable candidate with bundled audio tools"
depends = ["build", "tools:stage:linux", "licenses:native"]
run = "python scripts/native_package.py --platform linux --runtime src-tauri/resources/linux/audio-tools"

[tasks."legacy:setup"]
description = "Install dependencies for the retained React comparison interface"
run = "npm ci"

[tasks."legacy:preview"]
description = "Explore the retained browser comparison interface"
depends = ["legacy:setup"]
run = "npm exec -- vite --host 127.0.0.1"

[tasks."legacy:test"]
description = "Run retained TypeScript behavior tests"
depends = ["legacy:setup"]
run = "node --test tests/*.test.mjs"

[tasks.snapshot]
description = "Capture the fictional native review and quit (requires a display)"
run = "cargo run --locked -p jacket-iced --bin jacket -- --screenshot '{{ config_root }}/target/native-preview.png'"

[tasks."qualify:ui"]
description = "Capture 30 native workflow, theme, size, song and large-list views"
run = ["cargo build --locked -p jacket-iced --bin jacket", "python scripts/native_snapshots.py"]

[tasks."licenses:native"]
description = "Collect exact native Cargo dependency sources and license notices"
run = "python scripts/native_licenses.py"

[tasks."check:licenses"]
description = "Verify every resolved native dependency has an unchanged notice"
run = "python scripts/native_licenses.py --check"
