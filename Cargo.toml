[workspace]
members = ["apps/jacket", "crates/audio-engine", "crates/jacket-core", "crates/jacket-desktop"]
default-members = ["apps/jacket"]
resolver = "3"
exclude = ["src-tauri", "vendor/glib"]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.96"
publish = false
repository = "https://github.com/MoonlarkStudios/jacket"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
hex = "0.4.3"

# Shared policy inherited by every Rust crate; CI/quality checks deny warnings.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
