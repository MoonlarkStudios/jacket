[workspace]
members = ["crates/audio-engine", "src-tauri"]
resolver = "2"
exclude = ["vendor/glib"]

# GTK3 still requires GLib 0.18. Backport the upstream VariantStrIter fix
# instead of suppressing RUSTSEC-2024-0429. See vendor/README.md.
[patch.crates-io]
glib = { path = "vendor/glib" }

[workspace.package]
version = "0.1.0-beta.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/MoonlarkStudios/jacket"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Shared policy inherited by every Rust crate; CI/quality checks deny warnings.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
