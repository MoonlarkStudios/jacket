name: Pull request title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Release PR number whose title should be checked
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Use only the trusted base commit. Never check out or execute PR code
      # in pull_request_target, including same-repository PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkTitle } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/releases.mjs`);
            await checkTitle({ github, context, core });
