# Legacy DEB/RPM release verification is retained in scripts for old releases.
# Native candidates are not published by this branch.
name: Verify legacy published release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Legacy Tauri release tag to verify (read-only)
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify legacy release downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify legacy checksums, sources and immutable identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/check-published-release.py --repo "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
