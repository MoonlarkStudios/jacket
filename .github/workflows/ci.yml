name: Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build and test
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_NET_RETRY: 5

jobs:
  quality:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Linux windowing and media prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev ffmpeg
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.12
      - name: Restore native Rust dependencies and build outputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          # Reuse dependency builds across source commits. Toolchain, target,
          # manifest and build-configuration changes warm distinct entries.
          key: native-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config*', 'mise.toml', '.github/workflows/ci.yml') }}
          restore-keys: native-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Fetch locked Rust dependencies
        run: mise run fetch
      - name: Formatting, workflows, script checks, Clippy and native tests
        run: mise run check
      - name: Install macOS media tools
        if: runner.os == 'macOS'
        run: mise run setup:media
      - name: Offline media export and independent tag verification
        run: mise run test:media
      - name: Save complete native Rust cache
        # Do not preserve an incomplete immutable entry after any gate fails.
        if: ${{ success() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  security:
    name: Rust dependencies and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        id: tools
        with:
          version: 2026.9.12
      - name: Restore Rust dependency auditor
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit-cache
        with:
          path: ${{ runner.tool_cache }}/jacket-cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-${{ hashFiles('rust-toolchain.toml') }}
      - name: Prepare pinned Rust dependency auditor
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        id: audit-tool
        env:
          CACHE_HIT: ${{ steps.audit-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != 'true' ]; then
            mise exec -- cargo install cargo-audit --locked --version 0.22.2 --root "$RUNNER_TOOL_CACHE/jacket-cargo-audit"
          fi
          echo "$RUNNER_TOOL_CACHE/jacket-cargo-audit/bin" >> "$GITHUB_PATH"
      - name: Cache Rust dependency auditor before running audits
        if: ${{ !cancelled() && steps.audit-tool.outcome == 'success' && steps.audit-cache.outputs.cache-hit != 'true' && steps.audit-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/jacket-cargo-audit
          key: ${{ steps.audit-cache.outputs.cache-primary-key }}
      - name: Audit the native Rust dependency graph
        if: ${{ !cancelled() && steps.audit-tool.outcome == 'success' }}
        run: mise exec -- cargo audit
      - name: Scan Git history for secrets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise exec gitleaks@8.24.3 -- gitleaks git --redact --no-banner
