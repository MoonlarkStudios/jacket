# Native candidates are intentionally manual until the desktop acceptance,
# signing, dependency notices and corresponding-source checks are completed.
# This replaces the automatic Tauri installer/release publishing path.
name: Build native candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-candidates
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the exact candidate commit
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  package:
    name: Package native candidate (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev nasm autoconf automake libtool
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.12
      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        run: mise run setup:media
      - name: Build macOS native app candidate
        if: runner.os == 'macOS'
        run: mise run package:mac
      - name: Build Linux native portable candidate
        if: runner.os == 'Linux'
        run: mise run package:linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacket-native-${{ runner.os }}-${{ github.sha }}
          path: |
            target/native-candidates/*.tar.gz
            target/native-candidates/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
