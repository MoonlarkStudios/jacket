name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag to rebuild (leave empty to refresh the release PR)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  plan:
    name: Release PR and draft identity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      sha: ${{ steps.draft.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: inputs.tag == ''
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Explicitly run checks on bot-created release PRs
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            const { dispatchReleaseChecks } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/releases.mjs`);
            await dispatchReleaseChecks({ github, context, prs: JSON.parse(process.env.RELEASE_PRS) });
      - name: Resolve the exact unpublished release commit
        id: draft
        if: steps.release.outputs.release_created == 'true' || inputs.tag != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const { selectDraft } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/releases.mjs`);
            const { sha } = await selectDraft({ github, context, tag: process.env.RELEASE_TAG, expectedSha: process.env.RELEASE_SHA });
            core.setOutput('tag', process.env.RELEASE_TAG);
            core.setOutput('sha', sha);

  build:
    name: Validate release
    needs: plan
    if: needs.plan.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.plan.outputs.sha }}
      release_tag: ${{ needs.plan.outputs.tag }}

  assets:
    name: Attach verified assets to the draft
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-preview-x86_64
          path: release-assets
      - name: Verify exact source identity, complete asset set, and checksums
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: python3 scripts/check-release.py --artifacts release-assets --tag "$RELEASE_TAG" --commit "$RELEASE_SHA"
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const { uploadDraft } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/releases.mjs`);
            await uploadDraft({ github, context, core, tag: process.env.RELEASE_TAG, sha: process.env.RELEASE_SHA, directory: `${process.env.GITHUB_WORKSPACE}/release-assets` });
