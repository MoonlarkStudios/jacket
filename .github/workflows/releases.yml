# Native candidates are intentionally manual until the desktop acceptance,
# signing, dependency notices and corresponding-source checks are completed.
name: Build native candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-candidates
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the exact candidate commit
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  package:
    name: Package native candidate (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev nasm autoconf automake libtool
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.12
      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        run: mise run setup:media
      - name: Build macOS native app candidate
        if: runner.os == 'macOS'
        run: mise run package:mac
      - name: Build Linux native portable candidate
        if: runner.os == 'Linux'
        run: mise run package:linux
      - name: Verify candidate archive checksums
        working-directory: target/native-candidates
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 -c SHA256SUMS
          else
            sha256sum -c SHA256SUMS
          fi
      - name: Verify signed macOS app identifier
        if: runner.os == 'macOS'
        working-directory: target/native-candidates
        shell: bash
        run: |
          expected_id=com.moonlarkstudios.jacket
          shopt -s nullglob
          archives=(jacket-*-native-macos.tar.gz)
          if (( ${#archives[@]} != 1 )); then
            echo 'Expected exactly one native macOS app archive.' >&2
            exit 1
          fi
          extracted=$(mktemp -d "$RUNNER_TEMP/jacket-macos.XXXXXX")
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf "${archives[0]}" -C "$extracted"
          bundle="$extracted/Jacket.app"
          actual_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")
          if [ "$actual_id" != "$expected_id" ]; then
            printf 'Expected bundle identifier %s, found %s\n' "$expected_id" "$actual_id" >&2
            exit 1
          fi
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$bundle"
          /usr/bin/codesign --verify --verbose -R "=identifier = \"$expected_id\"" "$bundle"
          printf 'Verified signed macOS bundle identifier %s\n' "$actual_id"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacket-native-${{ runner.os }}-${{ github.sha }}
          path: |
            target/native-candidates/*.tar.gz
            target/native-candidates/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
